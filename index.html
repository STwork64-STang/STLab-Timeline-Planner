<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lab Interactive Visual Timeline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090d16',
                        cardBg: '#111827',
                        accentBlue: '#3b82f6',
                        accentPurple: '#8b5cf6',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #090d16; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen pb-16">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const ICONS = ['🧫', '🔬', '🧪', '⏳', '💉', '🧊', '🌡️', '🥼', '🧬', '📊'];

        const DEFAULT_STEPS = [
          {
            id: 'step-1',
            title: 'Seed Cells (เลี้ยงเซลล์ลง Plate)',
            icon: '🧫',
            type: 'action',
            startTime: new Date(new Date().setHours(10, 0, 0, 0)).toISOString().slice(0, 16),
            hours: 2,
            minutes: 0,
            notes: 'ใช้ 6-well plate, Density 1x10^5 cells/well เตรียมสื่อเลี้ยงเซลล์ DMEM + 10% FBS'
          },
          {
            id: 'step-2',
            title: 'Incubation (บ่มเซลล์ 16 ชม.)',
            icon: '⏳',
            type: 'incubate',
            startTime: new Date(new Date().setHours(12, 0, 0, 0)).toISOString().slice(0, 16),
            hours: 16,
            minutes: 0,
            notes: 'ตั้งค่าตู้ CO2 Incubator ที่ 37°C, 5% CO2 ห้ามเปิดตู้นาน'
          },
          {
            id: 'step-3',
            title: 'Drug Treatment (เริ่มใส่สารทดลอง)',
            icon: '💉',
            type: 'action',
            startTime: new Date(new Date(Date.now() + 86400000).setHours(4, 0, 0, 0)).toISOString().slice(0, 16),
            hours: 1,
            minutes: 30,
            notes: 'ใส่สารกลุ่ม Sample A และ B ละลายใน DMSO ความเข้มข้น 10 uM'
          }
        ];

        function App() {
          const [lang, setLang] = useState('th');
          const [steps, setSteps] = useState(() => {
            const saved = localStorage.getItem('lab_visual_timeline_v1');
            return saved ? JSON.parse(saved) : DEFAULT_STEPS;
          });

          const [selectedStepForDetail, setSelectedStepForDetail] = useState(null);
          const [isFormOpen, setIsFormOpen] = useState(false);
          const [editingStep, setEditingStep] = useState(null);

          const [formData, setFormData] = useState({
            title: '',
            icon: '🧫',
            type: 'action',
            startTime: new Date().toISOString().slice(0, 16),
            hours: 1,
            minutes: 0,
            notes: ''
          });

          useEffect(() => {
            localStorage.setItem('lab_visual_timeline_v1', JSON.stringify(steps));
          }, [steps]);

          // Process schedule and sort by Start Time
          const sortedTimeline = useMemo(() => {
            return steps.map(step => {
              const start = new Date(step.startTime);
              const durationMs = ((parseInt(step.hours || 0) * 60) + parseInt(step.minutes || 0)) * 60 * 1000;
              const end = new Date(start.getTime() + durationMs);
              return {
                ...step,
                startDateObj: start,
                endDateObj: end,
              };
            }).sort((a, b) => a.startDateObj - b.startDateObj);
          }, [steps]);

          const formatTime = (date) => {
            if (isNaN(date.getTime())) return '--:--';
            return date.toLocaleTimeString(lang === 'th' ? 'th-TH' : 'en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
          };

          const formatDate = (date) => {
            if (isNaN(date.getTime())) return '';
            return date.toLocaleDateString(lang === 'th' ? 'th-TH' : 'en-US', { month: 'short', day: 'numeric' });
          };

          const handleOpenForm = (stepToEdit = null) => {
            if (stepToEdit) {
              setEditingStep(stepToEdit);
              setFormData({ ...stepToEdit });
            } else {
              setEditingStep(null);
              setFormData({
                title: '',
                icon: '🧫',
                type: 'action',
                startTime: new Date().toISOString().slice(0, 16),
                hours: 1,
                minutes: 0,
                notes: ''
              });
            }
            setIsFormOpen(true);
          };

          const handleSaveStep = (e) => {
            e.preventDefault();
            if (!formData.title.trim()) return;

            if (editingStep) {
              setSteps(steps.map(s => s.id === editingStep.id ? { ...formData, id: editingStep.id } : s));
            } else {
              setSteps([...steps, { ...formData, id: 'step-' + Date.now() }]);
            }

            setIsFormOpen(false);
          };

          const handleDeleteStep = (id) => {
            if (confirm(lang === 'th' ? 'คุณต้องการลบขั้นตอนการทดลองนี้ใช่หรือไม่?' : 'Delete this step?')) {
              setSteps(steps.filter(s => s.id !== id));
              setSelectedStepForDetail(null);
            }
          };

          return (
            <div className="max-w-3xl mx-auto px-4 py-6 space-y-6">
              
              {/* Header */}
              <div className="flex justify-between items-center bg-cardBg border border-gray-800 p-4 rounded-2xl shadow-xl">
                <div>
                  <h1 className="font-bold text-lg text-white flex items-center gap-2">
                    <span>🔬</span> Lab Visual Timeline
                  </h1>
                  <p className="text-xs text-blue-400">วางแผนเวลาแล็บแบบเน้นไอคอน & กำหนดเวลาอิสระ</p>
                </div>
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => setLang(lang === 'th' ? 'en' : 'th')}
                    className="px-2.5 py-1 bg-gray-800 text-xs font-bold text-gray-300 rounded-lg border border-gray-700"
                  >
                    🌐 {lang === 'th' ? 'EN' : 'TH'}
                  </button>
                  <button
                    onClick={() => handleOpenForm(null)}
                    className="px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium text-xs rounded-xl shadow-lg"
                  >
                    + เพิ่มขั้นตอน
                  </button>
                </div>
              </div>

              {/* Visual Icon Timeline Bar */}
              <div className="bg-cardBg border border-gray-800 rounded-2xl p-4 sm:p-6 shadow-xl">
                <h2 className="text-xs font-bold text-gray-400 mb-6 uppercase tracking-wider">
                  📍 Timeline Flow (กดที่ไอคอนเพื่อดูรายละเอียด)
                </h2>

                <div className="relative border-l-2 border-dashed border-blue-500/40 ml-6 pl-8 space-y-8">
                  {sortedTimeline.map((step) => {
                    const isIncubate = step.type === 'incubate';

                    return (
                      <div key={step.id} className="relative group">
                        
                        {/* Interactive Clickable Icon Node */}
                        <button
                          onClick={() => setSelectedStepForDetail(step)}
                          className={`absolute -left-[57px] -top-1 w-14 h-14 rounded-2xl flex items-center justify-center text-2xl border-2 transition-all transform hover:scale-110 active:scale-95 shadow-xl ${
                            isIncubate 
                              ? 'bg-purple-950/90 border-purple-400 text-purple-200 shadow-purple-900/40' 
                              : 'bg-blue-950/90 border-blue-400 text-blue-200 shadow-blue-900/40'
                          }`}
                        >
                          {step.icon || '🧫'}
                        </button>

                        {/* Minimalist Visual Card */}
                        <div 
                          onClick={() => setSelectedStepForDetail(step)}
                          className={`p-3.5 rounded-2xl border cursor-pointer transition hover:border-blue-500/80 ${
                            isIncubate ? 'bg-purple-950/20 border-purple-500/30' : 'bg-gray-900/80 border-gray-800'
                          }`}
                        >
                          <div className="flex justify-between items-center gap-2">
                            <span className="font-bold text-sm text-white truncate">{step.title}</span>
                            <span className={`text-[10px] px-2 py-0.5 rounded-full shrink-0 font-medium ${
                              isIncubate ? 'bg-purple-500/20 text-purple-300' : 'bg-blue-500/20 text-blue-300'
                            }`}>
                              {isIncubate ? '⏳ Incubate' : '👨‍🔬 Action'}
                            </span>
                          </div>

                          {/* Time Bar */}
                          <div className="mt-2 flex items-center justify-between text-xs font-mono">
                            <span className="text-blue-400 font-semibold">
                              ▶ {formatTime(step.startDateObj)} <span className="text-[10px] text-gray-500">({formatDate(step.startDateObj)})</span>
                            </span>
                            <span className="text-gray-500">⟶</span>
                            <span className="text-emerald-400 font-semibold">
                              🏁 {formatTime(step.endDateObj)} <span className="text-[10px] text-gray-500">({formatDate(step.endDateObj)})</span>
                            </span>
                          </div>
                        </div>

                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Detail Pop-up Modal */}
              {selectedStepForDetail && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                  <div className="bg-cardBg border border-gray-800 rounded-2xl p-5 w-full max-w-md space-y-4 shadow-2xl">
                    <div className="flex justify-between items-start">
                      <div className="flex items-center gap-3">
                        <div className="w-12 h-12 rounded-xl bg-blue-500/10 border border-blue-500/30 flex items-center justify-center text-2xl">
                          {selectedStepForDetail.icon}
                        </div>
                        <div>
                          <h3 className="font-bold text-base text-white">{selectedStepForDetail.title}</h3>
                          <span className="text-xs text-blue-400">
                            {selectedStepForDetail.type === 'incubate' ? '⏳ Incubation / Wait' : '👨‍🔬 Hands-on Step'}
                          </span>
                        </div>
                      </div>
                      <button onClick={() => setSelectedStepForDetail(null)} className="text-gray-400 hover:text-white">✕</button>
                    </div>

                    <div className="bg-gray-900 p-3.5 rounded-xl border border-gray-800 space-y-2 text-xs">
                      <div className="flex justify-between">
                        <span className="text-gray-400">เวลาเริ่มต้น (Start Time):</span>
                        <span className="font-mono text-blue-400 font-bold">
                          {formatTime(selectedStepForDetail.startDateObj)} ({formatDate(selectedStepForDetail.startDateObj)})
                        </span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-gray-400">เวลาเสร็จ (End Time):</span>
                        <span className="font-mono text-emerald-400 font-bold">
                          {formatTime(selectedStepForDetail.endDateObj)} ({formatDate(selectedStepForDetail.endDateObj)})
                        </span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-gray-400">ระยะเวลา (Duration):</span>
                        <span className="text-gray-200">
                          {selectedStepForDetail.hours} ชม. {selectedStepForDetail.minutes} นาที
                        </span>
                      </div>
                    </div>

                    {selectedStepForDetail.notes && (
                      <div className="p-3 bg-gray-900/60 rounded-xl border border-gray-800 text-xs text-gray-300">
                        <span className="text-gray-400 font-bold block mb-1">📝 โน้ตรายละเอียด / สารเคมี:</span>
                        {selectedStepForDetail.notes}
                      </div>
                    )}

                    <div className="flex justify-between items-center pt-2 border-t border-gray-800">
                      <button
                        onClick={() => handleDeleteStep(selectedStepForDetail.id)}
                        className="px-3 py-1.5 bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 text-xs rounded-xl"
                      >
                        🗑️ ลบขั้นตอน
                      </button>
                      <button
                        onClick={() => {
                          const target = selectedStepForDetail;
                          setSelectedStepForDetail(null);
                          handleOpenForm(target);
                        }}
                        className="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-xs text-white font-medium rounded-xl"
                      >
                        ✏️ แก้ไขข้อมูล
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Add / Edit Form Modal */}
              {isFormOpen && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                  <div className="bg-cardBg border border-gray-800 rounded-2xl p-5 w-full max-w-md space-y-4">
                    <h3 className="text-base font-bold text-white">
                      {editingStep ? '✏️ แก้ไขขั้นตอนการทดลอง' : '➕ เพิ่มขั้นตอนการทดลอง'}
                    </h3>

                    <form onSubmit={handleSaveStep} className="space-y-3">
                      <div>
                        <label className="block text-xs text-gray-300 mb-1">ชื่อขั้นตอน *</label>
                        <input
                          type="text"
                          required
                          value={formData.title}
                          onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                          className="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-sm text-white"
                        />
                      </div>

                      {/* Icon Picker */}
                      <div>
                        <label className="block text-xs text-gray-300 mb-1">เลือกไอคอนสัญลักษณ์</label>
                        <div className="flex gap-2 overflow-x-auto pb-1">
                          {ICONS.map(ico => (
                            <button
                              key={ico}
                              type="button"
                              onClick={() => setFormData({ ...formData, icon: ico })}
                              className={`w-9 h-9 rounded-xl flex items-center justify-center text-lg border shrink-0 ${
                                formData.icon === ico ? 'bg-blue-600 border-blue-400' : 'bg-gray-900 border-gray-800'
                              }`}
                            >
                              {ico}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs text-gray-300 mb-1">ประเภทงาน</label>
                          <select
                            value={formData.type}
                            onChange={(e) => setFormData({ ...formData, type: e.target.value })}
                            className="w-full bg-gray-900 border border-gray-800 rounded-xl p-2 text-sm text-white"
                          >
                            <option value="action">👨‍🔬 Action (ลงมือทำ)</option>
                            <option value="incubate">⏳ Incubate (เวลาบ่ม/รอ)</option>
                          </select>
                        </div>

                        <div>
                          <label className="block text-xs text-gray-300 mb-1">เวลาเริ่ม (Start Time) *</label>
                          <input
                            type="datetime-local"
                            required
                            value={formData.startTime}
                            onChange={(e) => setFormData({ ...formData, startTime: e.target.value })}
                            className="w-full bg-gray-900 border border-gray-800 rounded-xl p-2 text-xs text-white"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs text-gray-300 mb-1">ชั่วโมง</label>
                          <input
                            type="number"
                            min="0"
                            value={formData.hours}
                            onChange={(e) => setFormData({ ...formData, hours: parseInt(e.target.value) || 0 })}
                            className="w-full bg-gray-900 border border-gray-800 rounded-xl p-2 text-sm text-white"
                          />
                        </div>
                        <div>
                          <label className="block text-xs text-gray-300 mb-1">นาที</label>
                          <input
                            type="number"
                            min="0"
                            max="59"
                            value={formData.minutes}
                            onChange={(e) => setFormData({ ...formData, minutes: parseInt(e.target.value) || 0 })}
                            className="w-full bg-gray-900 border border-gray-800 rounded-xl p-2 text-sm text-white"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs text-gray-300 mb-1">บันทึกเพิ่มเติม / สารเคมี / ข้อควรระวัง</label>
                        <textarea
                          rows={2}
                          value={formData.notes}
                          onChange={(e) => setFormData({ ...formData, notes: e.target.value })}
                          className="w-full bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-sm text-white"
                        />
                      </div>

                      <div className="flex justify-end gap-2 pt-2 border-t border-gray-800">
                        <button type="button" onClick={() => setIsFormOpen(false)} className="px-4 py-2 bg-gray-800 text-xs text-gray-300 rounded-xl">ยกเลิก</button>
                        <button type="submit" className="px-4 py-2 bg-blue-600 text-xs text-white rounded-xl font-medium">บันทึก</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
