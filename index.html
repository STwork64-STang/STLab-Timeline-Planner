<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lab Capsule Timeline UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121316',
                        cardBg: '#1c1e22',
                        capsuleBg: '#2a2d34',
                        accentBlue: '#3b82f6',
                        accentPurple: '#a855f7',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #121316; color: #e5e7eb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-track { background: #121316; }
        ::-webkit-scrollbar-thumb { background: #2b2d31; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen pb-20">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const ICONS = ['⏰', '🚗', '🧫', '🔬', '🧪', '⏳', '💉', '🧊', '🌡️', '🥼', '🧬', '📊'];

        const TRANSLATIONS = {
          th: {
            title: "Lab Capsule Timeline",
            addBtn: "+ Add Task",
            actionType: "Action",
            incubateType: "Incubate",
            start: "เริ่ม:",
            end: "เสร็จ:",
            duration: "ระยะเวลา:",
            hrs: "hrs",
            mins: "min",
            freeTime: "Free time",
            notesLabel: "📝 โน้ตรายละเอียด / สารเคมี:",
            deleteBtn: "🗑️ ลบขั้นตอน",
            editBtn: "✏️ แก้ไขข้อมูล",
            confirmDelete: "คุณต้องการลบขั้นตอนการทดลองนี้ใช่หรือไม่?",
            formAddTitle: "➕ เพิ่มขั้นตอนการทดลอง",
            formEditTitle: "✏️ แก้ไขขั้นตอนการทดลอง",
            taskTitleLabel: "ชื่อขั้นตอน *",
            iconLabel: "เลือกไอคอน",
            typeLabel: "ประเภทงาน",
            startTimeLabel: "เวลาเริ่ม (Start Time) *",
            notesFormLabel: "บันทึกเพิ่มเติม / สารเคมี / ข้อควรระวัง",
            cancel: "ยกเลิก",
            save: "บันทึก"
          },
          en: {
            title: "Lab Capsule Timeline",
            addBtn: "+ Add Task",
            actionType: "Action",
            incubateType: "Incubate",
            start: "Start:",
            end: "End:",
            duration: "Duration:",
            hrs: "hrs",
            mins: "min",
            freeTime: "Free time",
            notesLabel: "📝 Reagents / Notes:",
            deleteBtn: "🗑️ Delete Step",
            editBtn: "✏️ Edit Step",
            confirmDelete: "Delete this step?",
            formAddTitle: "➕ Add Experiment Step",
            formEditTitle: "✏️ Edit Experiment Step",
            taskTitleLabel: "Step Title *",
            iconLabel: "Select Icon",
            typeLabel: "Step Type",
            startTimeLabel: "Start Time *",
            notesFormLabel: "Notes / Reagent Details",
            cancel: "Cancel",
            save: "Save"
          }
        };

        const DEFAULT_STEPS = [
          {
            id: 'step-1',
            title: 'Rise and Shine (เตรียม Cell)',
            icon: '⏰',
            type: 'action',
            startTime: new Date(new Date().setHours(7, 30, 0, 0)).toISOString().slice(0, 16),
            hours: 1,
            minutes: 30,
            notes: 'เตรียม Cell Culture Plate'
          },
          {
            id: 'step-2',
            title: 'Work from wild grill restaurant (Incubate ยาว)',
            icon: '🚗',
            type: 'incubate',
            startTime: new Date(new Date().setHours(12, 0, 0, 0)).toISOString().slice(0, 16),
            hours: 2,
            minutes: 30,
            notes: 'บ่มตัวอย่างสารในตู้อบ 2.5 ชม.'
          },
          {
            id: 'step-3',
            title: 'Parallel Buffer Prep (งานทำซ้อน)',
            icon: '🧪',
            type: 'action',
            startTime: new Date(new Date().setHours(13, 0, 0, 0)).toISOString().slice(0, 16),
            hours: 1,
            minutes: 0,
            notes: 'เตรียม Solution ซ้อนช่วง 13:00'
          }
        ];

        function App() {
          const [lang, setLang] = useState('th');
          const t = TRANSLATIONS[lang];

          const [steps, setSteps] = useState(() => {
            const saved = localStorage.getItem('lab_capsule_timeline_v4');
            return saved ? JSON.parse(saved) : DEFAULT_STEPS;
          });

          const [selectedStepForDetail, setSelectedStepForDetail] = useState(null);
          const [isFormOpen, setIsFormOpen] = useState(false);
          const [editingStep, setEditingStep] = useState(null);

          const [formData, setFormData] = useState({
            title: '',
            icon: '🧫',
            type: 'action',
            startTime: new Date().toISOString().slice(0, 16),
            hours: 1,
            minutes: 0,
            notes: ''
          });

          useEffect(() => {
            localStorage.setItem('lab_capsule_timeline_v4', JSON.stringify(steps));
          }, [steps]);

          // Multi-Column Overlap Algorithm
          const columns = useMemo(() => {
            const sorted = steps.map(step => {
              const start = new Date(step.startTime);
              const durationMins = (parseInt(step.hours || 0) * 60) + parseInt(step.minutes || 0);
              const end = new Date(start.getTime() + durationMins * 60 * 1000);
              return {
                ...step,
                startDateObj: start,
                endDateObj: end,
                durationMins
              };
            }).sort((a, b) => a.startDateObj - b.startDateObj);

            if (sorted.length === 0) return [];

            const cols = [];
            sorted.forEach(task => {
              let placed = false;
              for (let col of cols) {
                const lastTaskInCol = col[col.length - 1];
                if (task.startDateObj >= lastTaskInCol.endDateObj) {
                  col.push(task);
                  placed = true;
                  break;
                }
              }
              if (!placed) {
                cols.push([task]);
              }
            });

            return cols;
          }, [steps]);

          const formatTime = (date) => {
            if (!date || isNaN(date.getTime())) return '--:--';
            return date.toLocaleTimeString(lang === 'th' ? 'th-TH' : 'en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
          };

          const formatDate = (date) => {
            if (!date || isNaN(date.getTime())) return '';
            return date.toLocaleDateString(lang === 'th' ? 'th-TH' : 'en-US', { month: 'short', day: 'numeric' });
          };

          const handleOpenForm = (stepToEdit = null) => {
            if (stepToEdit) {
              setEditingStep(stepToEdit);
              setFormData({ ...stepToEdit });
            } else {
              setEditingStep(null);
              setFormData({
                title: '',
                icon: '🧫',
                type: 'action',
                startTime: new Date().toISOString().slice(0, 16),
                hours: 1,
                minutes: 0,
                notes: ''
              });
            }
            setIsFormOpen(true);
          };

          const handleSaveStep = (e) => {
            e.preventDefault();
            if (!formData.title.trim()) return;

            if (editingStep) {
              setSteps(steps.map(s => s.id === editingStep.id ? { ...formData, id: editingStep.id } : s));
            } else {
              setSteps([...steps, { ...formData, id: 'step-' + Date.now() }]);
            }
            setIsFormOpen(false);
          };

          const handleDeleteStep = (id) => {
            if (confirm(t.confirmDelete)) {
              setSteps(steps.filter(s => s.id !== id));
              setSelectedStepForDetail(null);
            }
          };

          return (
            <div className="max-w-4xl mx-auto px-4 py-6 space-y-6">
              
              {/* Header */}
              <div className="flex justify-between items-center bg-[#1c1e22] border border-gray-800/80 p-4 rounded-3xl shadow-2xl">
                <div>
                  <h1 className="font-bold text-lg text-white tracking-wide">{t.title}</h1>
                  <p className="text-xs text-gray-400">Minimal Capsule UI + Multi-Column Overlap</p>
                </div>
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => setLang(lang === 'th' ? 'en' : 'th')}
                    className="px-3 py-1.5 bg-[#2a2d34] text-xs font-bold text-gray-300 rounded-full border border-gray-700/60"
                  >
                    🌐 {lang === 'th' ? 'EN' : 'TH'}
                  </button>
                  <button
                    onClick={() => handleOpenForm(null)}
                    className="px-4 py-2 bg-[#f87171]/20 hover:bg-[#f87171]/30 text-[#f87171] font-semibold text-xs rounded-full border border-[#f87171]/40 shadow-lg transition"
                  >
                    + Add Task
                  </button>
                </div>
              </div>

              {/* Timeline Container */}
              <div className="bg-[#121316] border border-gray-800/60 rounded-3xl p-4 sm:p-8 shadow-2xl overflow-x-auto">
                <div className="flex gap-10 min-w-max">
                  
                  {columns.length === 0 && (
                    <div className="text-center py-12 text-gray-500 text-sm w-full">
                      กดปุ่ม "+ Add Task" เพื่อเพิ่มขั้นตอนการทดลอง
                    </div>
                  )}

                  {columns.map((colTasks, colIdx) => (
                    <div key={colIdx} className="flex gap-4 items-start">
                      
                      {/* Column Separator if Multi-column */}
                      {colIdx > 0 && <div className="w-[1px] bg-gray-800/60 self-stretch my-4"></div>}

                      {/* Single Timeline Line Container */}
                      <div className="relative pl-16 pr-4 space-y-12">
                        
                        {/* Dashed Timeline Vertical Line */}
                        <div className="absolute left-[28px] top-4 bottom-4 w-[2px] border-l-2 border-dashed border-gray-700/60"></div>

                        {colTasks.map((step) => {
                          const hrs = Math.floor(step.durationMins / 60);
                          const mins = step.durationMins % 60;
                          
                          // Dynamic height for capsule based on duration
                          const capsuleHeightPx = Math.max(70, Math.floor((step.durationMins / 60) * 55));

                          return (
                            <div key={step.id} className="relative flex items-center group">
                              
                              {/* Left Side Time Indicator */}
                              <div className="absolute -left-16 text-[11px] font-mono font-medium text-gray-400 select-none">
                                {formatTime(step.startDateObj)}
                              </div>

                              {/* Vertical Capsule Node (Like Image) */}
                              <div
                                onClick={() => setSelectedStepForDetail(step)}
                                style={{ height: `${capsuleHeightPx}px` }}
                                className="relative z-10 w-14 rounded-full bg-[#2a2d34] border border-gray-600/40 flex items-center justify-center cursor-pointer hover:border-blue-400 hover:scale-105 transition-all shadow-xl shrink-0"
                              >
                                <span className="text-xl">{step.icon || '⏰'}</span>
                              </div>

                              {/* Right Side Task Details (Horizontal Layout) */}
                              <div 
                                onClick={() => setSelectedStepForDetail(step)}
                                className="ml-5 cursor-pointer max-w-xs sm:max-w-sm"
                              >
                                {/* Time & Duration Header */}
                                <div className="text-xs font-mono text-gray-400 flex items-center gap-2">
                                  <span>{formatTime(step.startDateObj)} – {formatTime(step.endDateObj)}</span>
                                  <span className="text-gray-500">
                                    ({hrs > 0 && `${hrs} hrs, `}{mins} min)
                                  </span>
                                </div>

                                {/* Task Title */}
                                <h3 className="text-sm font-bold text-white mt-0.5 tracking-wide line-clamp-2 hover:text-blue-400 transition">
                                  {step.title}
                                </h3>
                              </div>

                            </div>
                          );
                        })}

                      </div>

                    </div>
                  ))}

                </div>
              </div>

              {/* Detail Pop-up Modal */}
              {selectedStepForDetail && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                  <div className="bg-[#1c1e22] border border-gray-800 rounded-3xl p-6 w-full max-w-md space-y-5 shadow-2xl">
                    <div className="flex justify-between items-start">
                      <div className="flex items-center gap-3">
                        <div className="w-12 h-12 rounded-2xl bg-[#2a2d34] border border-gray-700 flex items-center justify-center text-2xl shadow-inner">
                          {selectedStepForDetail.icon}
                        </div>
                        <div>
                          <h3 className="font-bold text-base text-white">{selectedStepForDetail.title}</h3>
                          <span className="text-xs text-blue-400">
                            {selectedStepForDetail.type === 'incubate' ? t.incubateType : t.actionType}
                          </span>
                        </div>
                      </div>
                      <button onClick={() => setSelectedStepForDetail(null)} className="text-gray-400 hover:text-white">✕</button>
                    </div>

                    <div className="bg-[#121316] p-4 rounded-2xl border border-gray-800/80 space-y-2 text-xs">
                      <div className="flex justify-between">
                        <span className="text-gray-400">{t.start}</span>
                        <span className="font-mono text-blue-400 font-bold">
                          {formatTime(selectedStepForDetail.startDateObj)} ({formatDate(selectedStepForDetail.startDateObj)})
                        </span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-gray-400">{t.end}</span>
                        <span className="font-mono text-emerald-400 font-bold">
                          {formatTime(selectedStepForDetail.endDateObj)} ({formatDate(selectedStepForDetail.endDateObj)})
                        </span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-gray-400">{t.duration}</span>
                        <span className="text-gray-200 font-bold">
                          {selectedStepForDetail.hours} {t.hrs} {selectedStepForDetail.minutes} {t.mins}
                        </span>
                      </div>
                    </div>

                    {selectedStepForDetail.notes && (
                      <div className="p-3.5 bg-[#121316]/60 rounded-2xl border border-gray-800/80 text-xs text-gray-300">
                        <span className="text-gray-400 font-bold block mb-1">{t.notesLabel}</span>
                        {selectedStepForDetail.notes}
                      </div>
                    )}

                    <div className="flex justify-between items-center pt-2 border-t border-gray-800">
                      <button
                        onClick={() => handleDeleteStep(selectedStepForDetail.id)}
                        className="px-4 py-2 bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 text-xs rounded-full font-medium"
                      >
                        {t.deleteBtn}
                      </button>
                      <button
                        onClick={() => {
                          const target = selectedStepForDetail;
                          setSelectedStepForDetail(null);
                          handleOpenForm(target);
                        }}
                        className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-xs text-white font-medium rounded-full shadow-lg"
                      >
                        {t.editBtn}
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Add / Edit Form Modal */}
              {isFormOpen && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                  <div className="bg-[#1c1e22] border border-gray-800 rounded-3xl p-6 w-full max-w-md space-y-4">
                    <h3 className="text-base font-bold text-white">
                      {editingStep ? t.formEditTitle : t.formAddTitle}
                    </h3>

                    <form onSubmit={handleSaveStep} className="space-y-3">
                      <div>
                        <label className="block text-xs text-gray-300 mb-1">{t.taskTitleLabel}</label>
                        <input
                          type="text"
                          required
                          value={formData.title}
                          onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                          className="w-full bg-[#121316] border border-gray-800 rounded-2xl p-3 text-sm text-white focus:outline-none focus:border-blue-500"
                        />
                      </div>

                      <div>
                        <label className="block text-xs text-gray-300 mb-1">{t.iconLabel}</label>
                        <div className="flex gap-2 overflow-x-auto pb-1">
                          {ICONS.map(ico => (
                            <button
                              key={ico}
                              type="button"
                              onClick={() => setFormData({ ...formData, icon: ico })}
                              className={`w-10 h-10 rounded-2xl flex items-center justify-center text-lg border shrink-0 transition ${
                                formData.icon === ico ? 'bg-blue-600 border-blue-400 text-white' : 'bg-[#121316] border-gray-800 text-gray-300'
                              }`}
                            >
                              {ico}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs text-gray-300 mb-1">{t.typeLabel}</label>
                          <select
                            value={formData.type}
                            onChange={(e) => setFormData({ ...formData, type: e.target.value })}
                            className="w-full bg-[#121316] border border-gray-800 rounded-2xl p-2.5 text-xs text-white"
                          >
                            <option value="action">{t.actionType}</option>
                            <option value="incubate">{t.incubateType}</option>
                          </select>
                        </div>

                        <div>
                          <label className="block text-xs text-gray-300 mb-1">{t.startTimeLabel}</label>
                          <input
                            type="datetime-local"
                            required
                            value={formData.startTime}
                            onChange={(e) => setFormData({ ...formData, startTime: e.target.value })}
                            className="w-full bg-[#121316] border border-gray-800 rounded-2xl p-2.5 text-xs text-white"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs text-gray-300 mb-1">{t.hrs}</label>
                          <input
                            type="number"
                            min="0"
                            value={formData.hours}
                            onChange={(e) => setFormData({ ...formData, hours: parseInt(e.target.value) || 0 })}
                            className="w-full bg-[#121316] border border-gray-800 rounded-2xl p-2.5 text-sm text-white"
                          />
                        </div>
                        <div>
                          <label className="block text-xs text-gray-300 mb-1">{t.mins}</label>
                          <input
                            type="number"
                            min="0"
                            max="59"
                            value={formData.minutes}
                            onChange={(e) => setFormData({ ...formData, minutes: parseInt(e.target.value) || 0 })}
                            className="w-full bg-[#121316] border border-gray-800 rounded-2xl p-2.5 text-sm text-white"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs text-gray-300 mb-1">{t.notesFormLabel}</label>
                        <textarea
                          rows={2}
                          value={formData.notes}
                          onChange={(e) => setFormData({ ...formData, notes: e.target.value })}
                          className="w-full bg-[#121316] border border-gray-800 rounded-2xl p-3 text-sm text-white"
                        />
                      </div>

                      <div className="flex justify-end gap-2 pt-2 border-t border-gray-800">
                        <button type="button" onClick={() => setIsFormOpen(false)} className="px-4 py-2 bg-gray-800 text-xs text-gray-300 rounded-full">{t.cancel}</button>
                        <button type="submit" className="px-5 py-2 bg-blue-600 text-xs text-white rounded-full font-medium shadow-lg">{t.save}</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
