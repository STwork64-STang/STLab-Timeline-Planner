<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lab Google Calendar Style Timeline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121316',
                        cardBg: '#1c1e22',
                        gridBorder: '#2d3139',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #121316; color: #e5e7eb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-track { background: #121316; }
        ::-webkit-scrollbar-thumb { background: #2b2d31; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen pb-16">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const ICONS = ['🧫', '🔬', '🧪', '⏳', '💉', '🧊', '🌡️', '🥼', '🧬', '📊', '⏰', '🚗'];
        const HOUR_HEIGHT = 60; // 1 hour = 60px high in timeline

        const TRANSLATIONS = {
          th: {
            title: "🔬 Lab Schedule Calendar View",
            addBtn: "+ เพิ่มงาน",
            actionType: "🛠️ ทำงาน",
            incubateType: "⏳ รอ",
            start: "เริ่ม:",
            end: "เสร็จ:",
            duration: "ระยะเวลา:",
            hrs: "ชม.",
            mins: "นาที",
            notesLabel: "📝 โน้ตรายละเอียด / สารเคมี:",
            deleteBtn: "🗑️ ลบขั้นตอน",
            editBtn: "✏️ แก้ไขข้อมูล",
            confirmDelete: "คุณต้องการลบขั้นตอนการทดลองนี้ใช่หรือไม่?",
            formAddTitle: "➕ เพิ่มขั้นตอนการทดลอง",
            formEditTitle: "✏️ แก้ไขขั้นตอนการทดลอง",
            taskTitleLabel: "ชื่อขั้นตอน *",
            iconLabel: "เลือกไอคอน",
            typeLabel: "ประเภทงาน",
            startTimeLabel: "เวลาเริ่ม (Start Time) *",
            notesFormLabel: "บันทึกเพิ่มเติม / สารเคมี / ข้อควรระวัง",
            cancel: "ยกเลิก",
            save: "บันทึก"
          },
          en: {
            title: "🔬 Lab Schedule Calendar View",
            addBtn: "+ Add Task",
            actionType: "🛠️ Work",
            incubateType: "⏳ Wait",
            start: "Start:",
            end: "End:",
            duration: "Duration:",
            hrs: "hrs",
            mins: "min",
            notesLabel: "📝 Details / Reagents Notes:",
            deleteBtn: "🗑️ Delete Step",
            editBtn: "✏️ Edit Step",
            confirmDelete: "Delete this step?",
            formAddTitle: "➕ Add Experiment Step",
            formEditTitle: "✏️ Edit Experiment Step",
            taskTitleLabel: "Step Title *",
            iconLabel: "Select Icon",
            typeLabel: "Step Type",
            startTimeLabel: "Start Time *",
            notesFormLabel: "Notes / Reagent Details",
            cancel: "Cancel",
            save: "Save"
          }
        };

        const DEFAULT_STEPS = [
          {
            id: 'step-1',
            title: 'เลี้ยงเซลล์ลง Plate (Plate A)',
            icon: '🧫',
            type: 'action',
            startTime: new Date(new Date().setHours(8, 0, 0, 0)).toISOString().slice(0, 16),
            hours: 1,
            minutes: 30,
            notes: 'ใช้ 6-well plate A'
          },
          {
            id: 'step-2',
            title: 'บ่มตัวอย่างในตู้อบ (Incubation)',
            icon: '⏳',
            type: 'incubate',
            startTime: new Date(new Date().setHours(10, 0, 0, 0)).toISOString().slice(0, 16),
            hours: 3,
            minutes: 0,
            notes: 'บ่มเซลล์ 3 ชั่วโมง ที่ 37°C'
          },
          {
            id: 'step-3',
            title: 'เตรียม Solution B (งานซ้อนเวลากัน)',
            icon: '🧪',
            type: 'action',
            startTime: new Date(new Date().setHours(11, 0, 0, 0)).toISOString().slice(0, 16),
            hours: 1,
            minutes: 30,
            notes: 'เตรียมสารซ้อนช่วงรอ Incubate'
          }
        ];

        function App() {
          const [lang, setLang] = useState('th');
          const t = TRANSLATIONS[lang];

          const [steps, setSteps] = useState(() => {
            const saved = localStorage.getItem('lab_gcalendar_timeline_v5');
            return saved ? JSON.parse(saved) : DEFAULT_STEPS;
          });

          const [selectedStepForDetail, setSelectedStepForDetail] = useState(null);
          const [isFormOpen, setIsFormOpen] = useState(false);
          const [editingStep, setEditingStep] = useState(null);

          const [formData, setFormData] = useState({
            title: '',
            icon: '🧫',
            type: 'action',
            startTime: new Date().toISOString().slice(0, 16),
            hours: 1,
            minutes: 0,
            notes: ''
          });

          useEffect(() => {
            localStorage.setItem('lab_gcalendar_timeline_v5', JSON.stringify(steps));
          }, [steps]);

          // Process Google Calendar Day-Grid Overlap Positioning
          const processedTasks = useMemo(() => {
            const items = steps.map(step => {
              const start = new Date(step.startTime);
              const durationMins = (parseInt(step.hours || 0) * 60) + parseInt(step.minutes || 0);
              const end = new Date(start.getTime() + durationMins * 60 * 1000);
              
              const startMinutesFromMidnight = start.getHours() * 60 + start.getMinutes();
              const topPx = (startMinutesFromMidnight / 60) * HOUR_HEIGHT;
              const heightPx = Math.max(35, (durationMins / 60) * HOUR_HEIGHT);

              return {
                ...step,
                startDateObj: start,
                endDateObj: end,
                durationMins,
                topPx,
                heightPx
              };
            }).sort((a, b) => a.startDateObj - b.startDateObj);

            // Calculate Overlaps for Side-by-Side placement
            for (let i = 0; i < items.length; i++) {
              let overlapGroup = [items[i]];
              for (let j = 0; j < items.length; j++) {
                if (i !== j) {
                  const a = items[i];
                  const b = items[j];
                  if (a.startDateObj < b.endDateObj && a.endDateObj > b.startDateObj) {
                    overlapGroup.push(b);
                  }
                }
              }
              overlapGroup.sort((a, b) => a.id.localeCompare(b.id));
              const colIndex = overlapGroup.findIndex(item => item.id === items[i].id);
              items[i].totalCols = overlapGroup.length;
              items[i].colIndex = colIndex;
            }

            return items;
          }, [steps]);

          const hoursList = Array.from({ length: 24 }, (_, i) => i);

          const formatTime = (date) => {
            if (!date || isNaN(date.getTime())) return '--:--';
            return date.toLocaleTimeString(lang === 'th' ? 'th-TH' : 'en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
          };

          const formatDate = (date) => {
            if (!date || isNaN(date.getTime())) return '';
            return date.toLocaleDateString(lang === 'th' ? 'th-TH' : 'en-US', { month: 'short', day: 'numeric' });
          };

          const handleOpenForm = (stepToEdit = null) => {
            if (stepToEdit) {
              setEditingStep(stepToEdit);
              setFormData({ ...stepToEdit });
            } else {
              setEditingStep(null);
              setFormData({
                title: '',
                icon: '🧫',
                type: 'action',
                startTime: new Date().toISOString().slice(0, 16),
                hours: 1,
                minutes: 0,
                notes: ''
              });
            }
            setIsFormOpen(true);
          };

          const handleSaveStep = (e) => {
            e.preventDefault();
            if (!formData.title.trim()) return;

            if (editingStep) {
              setSteps(steps.map(s => s.id === editingStep.id ? { ...formData, id: editingStep.id } : s));
            } else {
              setSteps([...steps, { ...formData, id: 'step-' + Date.now() }]);
            }
            setIsFormOpen(false);
          };

          const handleDeleteStep = (id) => {
            if (confirm(t.confirmDelete)) {
              setSteps(steps.filter(s => s.id !== id));
              setSelectedStepForDetail(null);
            }
          };

          return (
            <div className="max-w-4xl mx-auto px-3 sm:px-4 py-6 space-y-4">
              
              {/* Header */}
              <div className="flex justify-between items-center bg-[#1c1e22] border border-gray-800 p-4 rounded-2xl shadow-xl">
                <div>
                  <h1 className="font-bold text-base sm:text-lg text-white">{t.title}</h1>
                  <p className="text-xs text-blue-400">Google Calendar Style • Overlap View</p>
                </div>
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => setLang(lang === 'th' ? 'en' : 'th')}
                    className="px-2.5 py-1 bg-gray-800 text-xs font-bold text-gray-300 rounded-lg border border-gray-700"
                  >
                    🌐 {lang === 'th' ? 'EN' : 'TH'}
                  </button>
                  <button
                    onClick={() => handleOpenForm(null)}
                    className="px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium text-xs rounded-xl shadow-lg"
                  >
                    {t.addBtn}
                  </button>
                </div>
              </div>

              {/* Google Calendar Time Grid Container */}
              <div className="bg-[#1c1e22] border border-gray-800 rounded-2xl shadow-2xl p-2 sm:p-4 overflow-y-auto max-h-[75vh]">
                <div className="relative min-w-[320px]" style={{ height: `${24 * HOUR_HEIGHT}px` }}>
                  
                  {/* Hour Lines & Labels */}
                  {hoursList.map(hour => (
                    <div 
                      key={hour} 
                      className="absolute left-0 right-0 border-t border-gray-800/60 flex items-start"
                      style={{ top: `${hour * HOUR_HEIGHT}px`, height: `${HOUR_HEIGHT}px` }}
                    >
                      <span className="text-[10px] font-mono text-gray-500 w-12 shrink-0 -mt-2">
                        {String(hour).padStart(2, '0')}:00
                      </span>
                    </div>
                  ))}

                  {/* Tasks Positioned as Cards on Time Grid */}
                  <div className="absolute left-12 right-0 top-0 bottom-0">
                    {processedTasks.map(task => {
                      const isIncubate = task.type === 'incubate';
                      const widthPct = 100 / task.totalCols;
                      const leftPct = task.colIndex * widthPct;

                      return (
                        <div
                          key={task.id}
                          onClick={() => setSelectedStepForDetail(task)}
                          style={{
                            top: `${task.topPx}px`,
                            height: `${task.heightPx}px`,
                            left: `${leftPct}%`,
                            width: `calc(${widthPct}% - 4px)`
                          }}
                          className={`absolute rounded-xl border p-2 cursor-pointer transition transform hover:z-30 hover:scale-[1.01] shadow-lg flex items-start gap-2 overflow-hidden ${
                            isIncubate 
                              ? 'bg-purple-950/80 border-purple-500/50 text-purple-100 hover:border-purple-400' 
                              : 'bg-blue-950/80 border-blue-500/50 text-blue-100 hover:border-blue-400'
                          }`}
                        >
                          {/* Main Visual Icon */}
                          <div className={`p-1 rounded-lg text-lg sm:text-xl shrink-0 ${
                            isIncubate ? 'bg-purple-900/60' : 'bg-blue-900/60'
                          }`}>
                            {task.icon || '🧫'}
                          </div>

                          {/* Task Info */}
                          <div className="min-w-0 flex-1">
                            <div className="flex items-center gap-1">
                              <span className="font-bold text-xs truncate">{task.title}</span>
                            </div>
                            <div className="text-[10px] font-mono opacity-80 truncate">
                              {formatTime(task.startDateObj)} - {formatTime(task.endDateObj)}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                </div>
              </div>

              {/* Detail Pop-up Modal */}
              {selectedStepForDetail && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                  <div className="bg-[#1c1e22] border border-gray-800 rounded-2xl p-5 w-full max-w-md space-y-4 shadow-2xl">
                    <div className="flex justify-between items-start">
                      <div className="flex items-center gap-3">
                        <div className="w-12 h-12 rounded-xl bg-blue-500/10 border border-blue-500/30 flex items-center justify-center text-2xl">
                          {selectedStepForDetail.icon}
                        </div>
                        <div>
                          <h3 className="font-bold text-base text-white">{selectedStepForDetail.title}</h3>
                          <span className="text-xs text-blue-400">
                            {selectedStepForDetail.type === 'incubate' ? t.incubateType : t.actionType}
                          </span>
                        </div>
                      </div>
                      <button onClick={() => setSelectedStepForDetail(null)} className="text-gray-400 hover:text-white">✕</button>
                    </div>

                    <div className="bg-[#121316] p-3.5 rounded-xl border border-gray-800 space-y-2 text-xs">
                      <div className="flex justify-between">
                        <span className="text-gray-400">{t.start}</span>
                        <span className="font-mono text-blue-400 font-bold">
                          {formatTime(selectedStepForDetail.startDateObj)} ({formatDate(selectedStepForDetail.startDateObj)})
                        </span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-gray-400">{t.end}</span>
                        <span className="font-mono text-emerald-400 font-bold">
                          {formatTime(selectedStepForDetail.endDateObj)} ({formatDate(selectedStepForDetail.endDateObj)})
                        </span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-gray-400">{t.duration}</span>
                        <span className="text-gray-200 font-bold">
                          {selectedStepForDetail.hours} {t.hrs} {selectedStepForDetail.minutes} {t.mins}
                        </span>
                      </div>
                    </div>

                    {selectedStepForDetail.notes && (
                      <div className="p-3 bg-[#121316]/60 rounded-xl border border-gray-800 text-xs text-gray-300">
                        <span className="text-gray-400 font-bold block mb-1">{t.notesLabel}</span>
                        {selectedStepForDetail.notes}
                      </div>
                    )}

                    <div className="flex justify-between items-center pt-2 border-t border-gray-800">
                      <button
                        onClick={() => handleDeleteStep(selectedStepForDetail.id)}
                        className="px-3 py-1.5 bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 text-xs rounded-xl"
                      >
                        {t.deleteBtn}
                      </button>
                      <button
                        onClick={() => {
                          const target = selectedStepForDetail;
                          setSelectedStepForDetail(null);
                          handleOpenForm(target);
                        }}
                        className="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-xs text-white font-medium rounded-xl"
                      >
                        {t.editBtn}
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Add / Edit Form Modal */}
              {isFormOpen && (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                  <div className="bg-[#1c1e22] border border-gray-800 rounded-2xl p-5 w-full max-w-md space-y-4">
                    <h3 className="text-base font-bold text-white">
                      {editingStep ? t.formEditTitle : t.formAddTitle}
                    </h3>

                    <form onSubmit={handleSaveStep} className="space-y-3">
                      <div>
                        <label className="block text-xs text-gray-300 mb-1">{t.taskTitleLabel}</label>
                        <input
                          type="text"
                          required
                          value={formData.title}
                          onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                          className="w-full bg-[#121316] border border-gray-800 rounded-xl p-2.5 text-sm text-white"
                        />
                      </div>

                      <div>
                        <label className="block text-xs text-gray-300 mb-1">{t.iconLabel}</label>
                        <div className="flex gap-2 overflow-x-auto pb-1">
                          {ICONS.map(ico => (
                            <button
                              key={ico}
                              type="button"
                              onClick={() => setFormData({ ...formData, icon: ico })}
                              className={`w-9 h-9 rounded-xl flex items-center justify-center text-lg border shrink-0 ${
                                formData.icon === ico ? 'bg-blue-600 border-blue-400' : 'bg-[#121316] border-gray-800'
                              }`}
                            >
                              {ico}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs text-gray-300 mb-1">{t.typeLabel}</label>
                          <select
                            value={formData.type}
                            onChange={(e) => setFormData({ ...formData, type: e.target.value })}
                            className="w-full bg-[#121316] border border-gray-800 rounded-xl p-2 text-sm text-white"
                          >
                            <option value="action">{t.actionType}</option>
                            <option value="incubate">{t.incubateType}</option>
                          </select>
                        </div>

                        <div>
                          <label className="block text-xs text-gray-300 mb-1">{t.startTimeLabel}</label>
                          <input
                            type="datetime-local"
                            required
                            value={formData.startTime}
                            onChange={(e) => setFormData({ ...formData, startTime: e.target.value })}
                            className="w-full bg-[#121316] border border-gray-800 rounded-xl p-2 text-xs text-white"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs text-gray-300 mb-1">{t.hrs}</label>
                          <input
                            type="number"
                            min="0"
                            value={formData.hours}
                            onChange={(e) => setFormData({ ...formData, hours: parseInt(e.target.value) || 0 })}
                            className="w-full bg-[#121316] border border-gray-800 rounded-xl p-2 text-sm text-white"
                          />
                        </div>
                        <div>
                          <label className="block text-xs text-gray-300 mb-1">{t.mins}</label>
                          <input
                            type="number"
                            min="0"
                            max="59"
                            value={formData.minutes}
                            onChange={(e) => setFormData({ ...formData, minutes: parseInt(e.target.value) || 0 })}
                            className="w-full bg-[#121316] border border-gray-800 rounded-xl p-2 text-sm text-white"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs text-gray-300 mb-1">{t.notesFormLabel}</label>
                        <textarea
                          rows={2}
                          value={formData.notes}
                          onChange={(e) => setFormData({ ...formData, notes: e.target.value })}
                          className="w-full bg-[#121316] border border-gray-800 rounded-xl p-2.5 text-sm text-white"
                        />
                      </div>

                      <div className="flex justify-end gap-2 pt-2 border-t border-gray-800">
                        <button type="button" onClick={() => setIsFormOpen(false)} className="px-4 py-2 bg-gray-800 text-xs text-gray-300 rounded-xl">{t.cancel}</button>
                        <button type="submit" className="px-4 py-2 bg-blue-600 text-xs text-white rounded-xl font-medium">{t.save}</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
